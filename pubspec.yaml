name: merkez_kisisellestirme
description: "Kişiselleştirme merkez uygulaması: 9 çevrimdışı araç. Android, iOS ve Web."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Ortak çekirdek: https://github.com/taktemurr-ops/studio-core
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 92d96c2ed9c0ab3fe539aeafcf8c61c3ca8f78ce
  # Araçların ortak motoru
  kisisel_motoru:
    git:
      url: https://github.com/taktemurr-ops/kisisel-motoru
      ref: 8427dca132e3642f02965b597cddda2c9a9f6a18
  # Merkezdeki araçlar (her biri kendi deposunda)
  uyg_canli_duvar_kagidi:
    git:
      url: https://github.com/taktemurr-ops/uyg-canli-duvar-kagidi
      ref: 9669c853a3d98f39b425aaa888bb2c89e0b10840
  uyg_widget_paketi:
    git:
      url: https://github.com/taktemurr-ops/uyg-widget-paketi
      ref: 4a8e600dfe2f514e9c4e2b875987194bfaba0c8c
  uyg_ozgun_ikon_paketi:
    git:
      url: https://github.com/taktemurr-ops/uyg-ozgun-ikon-paketi
      ref: fcac4498bc7088b296be292d72de49e2f901b622
  uyg_bildirim_ve_zil_sesi_paketi:
    git:
      url: https://github.com/taktemurr-ops/uyg-bildirim-ve-zil-sesi-paketi
      ref: 5580818c26ad8f70138b7658377c6e18e01d70e1
  uyg_kilit_ekrani_saati:
    git:
      url: https://github.com/taktemurr-ops/uyg-kilit-ekrani-saati
      ref: d93e5627f32e0b84fd5fb3ffb791083a8107330e
  uyg_renk_paleti_uretici:
    git:
      url: https://github.com/taktemurr-ops/uyg-renk-paleti-uretici
      ref: 89263888479393e51bc9f67f6aa0baecf7aa9af8
  uyg_sik_yazi_uretici:
    git:
      url: https://github.com/taktemurr-ops/uyg-sik-yazi-uretici
      ref: a988ef98e72ef78eac2c6daa472020d6e0932727
  uyg_kenar_isiklandirma:
    git:
      url: https://github.com/taktemurr-ops/uyg-kenar-isiklandirma
      ref: d6201cd0a21f9dca44ae18fe40fecb429f688c9e
  uyg_sarj_animasyonu:
    git:
      url: https://github.com/taktemurr-ops/uyg-sarj-animasyonu
      ref: d4c160a4e788d48b12028e7f8cf1d95b6df5be21
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2
  audioplayers: ^6.5.0
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.2.0

dependency_overrides:
  # Bütün araçlar aynı çekirdek ve motor sürümünü kullansın.
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 92d96c2ed9c0ab3fe539aeafcf8c61c3ca8f78ce
  kisisel_motoru:
    git:
      url: https://github.com/taktemurr-ops/kisisel-motoru
      ref: 8427dca132e3642f02965b597cddda2c9a9f6a18

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#1A1030"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#1A1030"
    theme_color: "#1A1030"

flutter_native_splash:
  color: "#1A1030"
  image: assets/branding/splash.png
  android_12:
    color: "#1A1030"
    image: assets/branding/splash_android12.png
  web: true
