dependency_overrides:
  # Bütün araçlar aynı çekirdek ve motor sürümünü kullansın.
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 90ed1f43faa38da24ba0e2fa2d238b9c1c5e5df2
  kisisel_motoru:
    git:
      url: https://github.com/taktemurr-ops/kisisel-motoru
      ref: 27d97c01b29ed69002c8382b4bc0d49967f5ed88

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#1A1030"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#1A1030"
    theme_color: "#1A1030"

flutter_native_splash:
  color: "#1A1030"
  image: assets/branding/splash.png
  android_12:
    color: "#1A1030"
    image: assets/branding/splash_android12.png
  web: true
